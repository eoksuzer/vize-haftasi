<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Vize Haftası</title>
<style>
:root{
  --bg:#f6f5f1; --card:#ffffff; --ink:#1c1b19; --muted:#6b6a65; --line:#e6e3dc;
  --brand:#0f766e; --brand-soft:#e0f2ef; --ok:#15803d; --ok-soft:#dcfce7;
  --bad:#b91c1c; --bad-soft:#fee2e2; --new:#c2410c; --new-soft:#ffedd5;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#121412; --card:#1b1e1c; --ink:#eceae4; --muted:#9a9a93; --line:#2b2f2c;
    --brand:#2dd4bf; --brand-soft:#123a35; --ok:#4ade80; --ok-soft:#14321f;
    --bad:#f87171; --bad-soft:#3a1717; --new:#fb923c; --new-soft:#3a2312;
    --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.5;min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:640px;margin:0 auto;padding:16px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
h1,h2,h3{margin:0;line-height:1.25}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 16px}
.brand small{display:block;color:var(--muted);font-size:13px}
.brand h1{font-size:24px;letter-spacing:-.02em}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .4s}
.overall{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px;box-shadow:var(--shadow)}
.overall .row{display:flex;justify-content:space-between;font-size:14px;margin-bottom:8px}
.motto{font-size:14px;color:var(--muted);margin-top:8px}

/* section */
.sec-title{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:20px 4px 8px}

/* test cards */
.card{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:10px;box-shadow:var(--shadow);transition:transform .12s}
.card:active{transform:scale(.985)}
.card .meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:4px;flex-wrap:wrap}
.card h3{font-size:17px;margin-bottom:4px}
.card p{margin:0 0 12px;font-size:14px;color:var(--muted)}
.card .foot{display:flex;align-items:center;gap:10px;font-size:13px}
.card .foot .bar{flex:1}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;letter-spacing:.03em}
.pill.new{background:var(--new-soft);color:var(--new)}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.pill.lesson{background:var(--brand-soft);color:var(--brand)}
.card.wrongs{border-color:var(--bad);background:linear-gradient(0deg,var(--bad-soft),var(--card) 70%)}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:12px}

/* quiz */
.qhead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.qhead .bar{flex:1}
.qhead .count{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
.qtitle{font-size:13px;color:var(--muted);margin-bottom:8px}
.qtext{font-size:19px;font-weight:600;margin:0 0 16px;letter-spacing:-.01em}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;font-size:16px;transition:border-color .15s,background .15s}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--bg);font-weight:700;font-size:14px}
.opt:not([disabled]):active{border-color:var(--brand)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .k{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.55}
.explain{border-radius:14px;padding:14px;margin:4px 0 14px;font-size:15px;animation:pop .2s ease}
.explain.ok{background:var(--ok-soft)}
.explain.bad{background:var(--bad-soft)}
.explain strong{display:block;margin-bottom:4px}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.btn{display:block;width:100%;padding:15px;border-radius:14px;font-weight:700;font-size:16px;background:var(--brand);color:#fff;text-align:center}
@media (prefers-color-scheme:dark){.btn{color:#062b27}}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn+.btn{margin-top:10px}
.back{display:inline-flex;align-items:center;gap:6px;font-size:15px;color:var(--muted);padding:8px 0;margin-bottom:8px}

/* result */
.score{text-align:center;padding:24px 16px;background:var(--card);border:1px solid var(--line);border-radius:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.ring{width:140px;height:140px;margin:0 auto 12px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:34px;font-variant-numeric:tabular-nums}
.score h2{font-size:20px;margin-bottom:4px}
.score p{margin:0;color:var(--muted)}
.review{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.review .q{font-weight:600;margin-bottom:8px}
.review .line{font-size:14px;display:flex;gap:6px;margin:2px 0}
.review .line.y{color:var(--bad)}
.review .line.c{color:var(--ok)}
.review .ex{font-size:14px;color:var(--muted);margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
.tabs{display:flex;gap:6px;margin-bottom:12px;background:var(--card);border:1px solid var(--line);padding:4px;border-radius:12px}
.tabs button{flex:1;padding:8px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--brand-soft);color:var(--brand)}
.footer{text-align:center;font-size:12px;color:var(--muted);padding:24px 0 8px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script src="data.js"></script>
<script>
(function(){
  "use strict";
  var KEY = "vize-quiz-v1";
  var NEW_DAYS = 10;

  // ---------- storage (sessiz hata) ----------
  function load(){
    try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; }
  }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
  }
  var S = load();
  S.tests = S.tests || {};   // id -> {best, last, attempts, seen, answers:{qi:bool}}
  S.streakDay = S.streakDay || null;
  S.streak = S.streak || 0;
  // İlk ziyarette mevcut testler "bilinen" sayılır; sonradan eklenenler YENİ rozeti alır.
  if(!S.known){ S.known = (window.TESTS||[]).map(function(t){return t.id;}); save(); }

  var app = document.getElementById("app");
  var TESTS = window.TESTS || [];

  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  function T(id){ return S.tests[id] || (S.tests[id] = {best:null,last:null,attempts:0,seen:false,answers:{}}); }
  function today(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function daysSince(s){ return Math.floor((new Date(today()) - new Date(s)) / 864e5); }
  function isNew(t){ return S.known.indexOf(t.id) === -1 && !T(t.id).seen && daysSince(t.date) <= NEW_DAYS; }
  function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x;} return a; }

  function bumpStreak(){
    var t = today();
    if(S.streakDay === t) return;
    if(S.streakDay && daysSince(S.streakDay) === 1) S.streak++; else S.streak = 1;
    S.streakDay = t;
  }

  function allWrong(){
    var out=[];
    TESTS.forEach(function(t){
      var ans=T(t.id).answers;
      t.questions.forEach(function(q,i){ if(ans[i]===false) out.push({test:t,qi:i}); });
    });
    return out;
  }

  function totals(){
    var total=0, solved=0, correct=0;
    TESTS.forEach(function(t){
      total += t.questions.length;
      var ans=T(t.id).answers;
      Object.keys(ans).forEach(function(k){ solved++; if(ans[k]) correct++; });
    });
    return {total:total, solved:solved, correct:correct};
  }

  function motto(pct, solved){
    if(!solved) return "İlk testle başla, 10 dakikanı alır.";
    if(pct>=90) return "Vizeye hazırsın. Yanlış kalan varsa onları da temizle.";
    if(pct>=70) return "İyi gidiyor. Yanlışlarını tekrar çözüp %90'ı geç.";
    if(pct>=50) return "Yarı yoldasın. Açıklamaları okuyarak bir tur daha.";
    return "Sorun değil, açıklamalar tam bunun için. Devam!";
  }

  // ---------- HOME ----------
  function home(){
    var tt = totals();
    var pct = tt.solved ? Math.round(tt.correct/tt.solved*100) : 0;
    var cover = tt.total ? Math.round(tt.solved/tt.total*100) : 0;
    var wrongs = allWrong();
    var sorted = TESTS.slice().sort(function(a,b){ return a.date<b.date?1:a.date>b.date?-1:0; });
    var fresh = sorted.filter(isNew);
    var rest = sorted.filter(function(t){ return !isNew(t); });

    var h = '';
    h += '<header class="top"><div class="brand"><small>'+esc(SITE.course)+'</small><h1>'+esc(SITE.title)+'</h1></div></header>';
    h += '<div class="stats">'
      + '<div class="stat"><b>'+tt.solved+'/'+tt.total+'</b><span>çözülen soru</span></div>'
      + '<div class="stat"><b>%'+pct+'</b><span>başarı</span></div>'
      + '<div class="stat"><b>'+(S.streak||0)+'🔥</b><span>gün seri</span></div>'
      + '</div>';
    h += '<div class="overall"><div class="row"><span>Konu kapsamı</span><b>%'+cover+'</b></div>'
      + '<div class="bar"><i style="width:'+cover+'%"></i></div>'
      + '<div class="motto">'+esc(motto(pct,tt.solved))+'</div></div>';

    if(wrongs.length){
      h += '<button class="card wrongs" data-act="wrongs"><div class="meta"><span class="pill" style="background:var(--bad);color:#fff">TEKRAR</span></div>'
        + '<h3>Yanlışlarım ('+wrongs.length+')</h3><p>Yanlış yaptığın soruları karışık olarak tekrar çöz. Doğru yaptıkça listeden düşer.</p></button>';
    }

    if(fresh.length){
      h += '<div class="sec-title">✨ Yeni eklenenler</div>';
      fresh.forEach(function(t){ h += card(t); });
    }
    if(rest.length){
      h += '<div class="sec-title">'+(fresh.length?'Önceki testler':'Testler')+'</div>';
      rest.forEach(function(t){ h += card(t); });
    }

    h += '<div class="footer">İlerlemen bu cihazda saklanır.</div>';
    app.innerHTML = h;
    window.scrollTo(0,0);
  }

  function card(t){
    var s = T(t.id), n = t.questions.length;
    var answered = Object.keys(s.answers).length;
    var correct = Object.keys(s.answers).filter(function(k){return s.answers[k];}).length;
    var p = Math.round(answered/n*100);
    var pills = '<span class="pill lesson">'+esc(t.lesson)+'</span>';
    if(isNew(t)) pills += '<span class="pill new">YENİ</span>';
    if(s.best!==null && s.best===n) pills += '<span class="pill done">TAM PUAN</span>';
    var info = s.attempts
      ? 'En iyi: <b>'+s.best+'/'+n+'</b> · '+s.attempts+' deneme'
      : n+' soru · henüz çözülmedi';
    return '<button class="card" data-act="start" data-id="'+t.id+'">'
      + '<div class="meta">'+pills+'</div>'
      + '<h3>'+esc(t.title)+'</h3><p>'+esc(t.desc)+'</p>'
      + '<div class="foot"><div class="bar"><i style="width:'+(answered?Math.round(correct/n*100):0)+'%"></i></div><span>'+info+'</span></div>'
      + '</button>';
  }

  // ---------- QUIZ ----------
  var Q = null; // {title, items:[{test,qi}], i, results:[], mode, testId}

  function start(testId){
    var t = TESTS.filter(function(x){return x.id===testId;})[0];
    T(t.id).seen = true; save();
    Q = { title:t.title, mode:"test", testId:t.id, i:0, results:[],
          items: t.questions.map(function(_,qi){ return {test:t, qi:qi}; }) };
    Q.items.forEach(prep);
    question();
  }
  function startWrongs(){
    Q = { title:"Yanlışlarım", mode:"wrongs", i:0, results:[], items: shuffle(allWrong()) };
    Q.items.forEach(prep);
    question();
  }
  function prep(it){ it.order = shuffle([0,1,2,3].slice(0, it.test.questions[it.qi].o.length)); }

  function question(){
    var it = Q.items[Q.i], q = it.test.questions[it.qi], n = Q.items.length;
    var h = '<button class="back" data-act="quit">← Testler</button>';
    h += '<div class="qhead"><div class="bar"><i style="width:'+Math.round(Q.i/n*100)+'%"></i></div><span class="count">'+(Q.i+1)+' / '+n+'</span></div>';
    h += '<div class="qtitle">'+esc(Q.mode==="wrongs" ? it.test.title : Q.title)+'</div>';
    h += '<p class="qtext">'+esc(q.q)+'</p>';
    it.order.forEach(function(oi,pos){
      h += '<button class="opt" data-act="pick" data-oi="'+oi+'"><span class="k">'+"ABCD"[pos]+'</span><span>'+esc(q.o[oi])+'</span></button>';
    });
    h += '<div id="after"></div>';
    app.innerHTML = h;
    window.scrollTo(0,0);
  }

  function pick(oi, btn){
    var it = Q.items[Q.i], q = it.test.questions[it.qi];
    var ok = oi === q.a;
    var opts = app.querySelectorAll(".opt");
    opts.forEach(function(b){
      b.disabled = true;
      var v = +b.getAttribute("data-oi");
      if(v===q.a) b.classList.add("ok");
      else if(b===btn) b.classList.add("bad");
      else b.classList.add("dim");
    });
    T(it.test.id).answers[it.qi] = ok;
    Q.results.push({it:it, picked:oi, ok:ok});
    bumpStreak(); save();
    if(navigator.vibrate && !ok){ try{navigator.vibrate(60);}catch(e){} }

    var last = Q.i === Q.items.length-1;
    var after = document.getElementById("after");
    after.innerHTML = '<div class="explain '+(ok?'ok':'bad')+'"><strong>'+(ok?'✓ Doğru!':'✗ Yanlış. Doğru cevap: '+esc(q.o[q.a]))+'</strong>'+esc(q.e)+'</div>'
      + '<button class="btn" data-act="next">'+(last?'Sonucu gör':'Sonraki soru →')+'</button>';
    after.scrollIntoView({behavior:"smooth", block:"nearest"});
  }

  function next(){
    if(Q.i < Q.items.length-1){ Q.i++; question(); }
    else finish();
  }

  // ---------- RESULT ----------
  function finish(){
    var n = Q.results.length;
    var c = Q.results.filter(function(r){return r.ok;}).length;
    if(Q.mode==="test"){
      var s = T(Q.testId);
      s.attempts++; s.last = c; s.best = s.best===null ? c : Math.max(s.best, c);
      save();
    }
    Q.view = Q.results.some(function(r){return !r.ok;}) ? "wrong" : "all";
    result();
  }

  function result(){
    var n = Q.results.length;
    var c = Q.results.filter(function(r){return r.ok;}).length;
    var pct = n ? Math.round(c/n*100) : 0;
    var R = 60, C = 2*Math.PI*R;
    var color = pct>=80 ? "var(--ok)" : pct>=50 ? "var(--brand)" : "var(--bad)";
    var head = pct===100 ? "Kusursuz! 🎉" : pct>=80 ? "Çok iyi!" : pct>=50 ? "Fena değil, biraz daha." : "Tekrar zamanı.";

    var h = '<button class="back" data-act="home">← Testler</button>';
    h += '<div class="score"><div class="ring"><svg width="140" height="140" viewBox="0 0 140 140">'
      + '<circle cx="70" cy="70" r="'+R+'" fill="none" stroke="var(--line)" stroke-width="12"/>'
      + '<circle cx="70" cy="70" r="'+R+'" fill="none" stroke="'+color+'" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+(C*(1-pct/100))+'"/>'
      + '</svg><b>%'+pct+'</b></div>'
      + '<h2>'+head+'</h2><p>'+c+' doğru · '+(n-c)+' yanlış · '+esc(Q.title)+'</p></div>';

    if(n-c>0) h += '<button class="btn" data-act="retrywrong">Bu testteki yanlışları tekrar çöz ('+(n-c)+')</button>';
    h += '<button class="btn ghost" data-act="'+(Q.mode==="test"?'again':'home')+'">'+(Q.mode==="test"?'Testi baştan çöz':'Ana sayfaya dön')+'</button>';

    h += '<div class="sec-title">Cevapların</div>';
    h += '<div class="tabs"><button data-act="view" data-v="wrong" class="'+(Q.view==="wrong"?'on':'')+'">Yanlışlar ('+(n-c)+')</button>'
      + '<button data-act="view" data-v="all" class="'+(Q.view==="all"?'on':'')+'">Hepsi ('+n+')</button></div>';

    var list = Q.results.filter(function(r){ return Q.view==="all" || !r.ok; });
    if(!list.length) h += '<div class="empty">Hiç yanlış yok, helal olsun.</div>';
    list.forEach(function(r){
      var q = r.it.test.questions[r.it.qi];
      h += '<div class="review"><div class="q">'+(r.ok?'✅ ':'❌ ')+esc(q.q)+'</div>';
      if(!r.ok) h += '<div class="line y">Senin cevabın: '+esc(q.o[r.picked])+'</div>';
      h += '<div class="line c">Doğru cevap: '+esc(q.o[q.a])+'</div>';
      h += '<div class="ex">'+esc(q.e)+'</div></div>';
    });
    app.innerHTML = h;
    window.scrollTo(0,0);
  }

  function retryWrongFromResult(){
    var items = Q.results.filter(function(r){return !r.ok;}).map(function(r){ return {test:r.it.test, qi:r.it.qi}; });
    Q = { title:"Yanlışları tekrar", mode:"wrongs", i:0, results:[], items: shuffle(items) };
    Q.items.forEach(prep);
    question();
  }

  // ---------- events ----------
  app.addEventListener("click", function(ev){
    var b = ev.target.closest("[data-act]"); if(!b) return;
    var a = b.getAttribute("data-act");
    if(a==="start") start(b.getAttribute("data-id"));
    else if(a==="wrongs") startWrongs();
    else if(a==="pick" && !b.disabled) pick(+b.getAttribute("data-oi"), b);
    else if(a==="next") next();
    else if(a==="home") home();
    else if(a==="quit"){ if(!Q.results.length || confirm("Testten çıkılsın mı? Cevapladıkların kaydedildi.")) home(); }
    else if(a==="again") start(Q.testId);
    else if(a==="retrywrong") retryWrongFromResult();
    else if(a==="view"){ Q.view = b.getAttribute("data-v"); result(); }
  });

  home();
})();
</script>
</body>
</html>
