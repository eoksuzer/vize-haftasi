<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Vize Haftası</title>
<style>
:root{
  --bg:#f6f5f1; --card:#ffffff; --ink:#1c1b19; --muted:#6b6a65; --line:#e6e3dc;
  --brand:#0f766e; --brand-soft:#e0f2ef; --ok:#15803d; --ok-soft:#dcfce7;
  --bad:#b91c1c; --bad-soft:#fee2e2; --new:#c2410c; --new-soft:#ffedd5;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#121412; --card:#1b1e1c; --ink:#eceae4; --muted:#9a9a93; --line:#2b2f2c;
    --brand:#2dd4bf; --brand-soft:#123a35; --ok:#4ade80; --ok-soft:#14321f;
    --bad:#f87171; --bad-soft:#3a1717; --new:#fb923c; --new-soft:#3a2312;
    --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.5;min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:640px;margin:0 auto;padding:16px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
h1,h2,h3{margin:0;line-height:1.25}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 16px}
.brand small{display:block;color:var(--muted);font-size:13px}
.brand h1{font-size:24px;letter-spacing:-.02em}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .4s}
.overall{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px;box-shadow:var(--shadow)}
.overall .row{display:flex;justify-content:space-between;font-size:14px;margin-bottom:8px}
.motto{font-size:14px;color:var(--muted);margin-top:8px}

/* section */
.sec-title{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:20px 4px 8px}

/* test cards */
.card{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:10px;box-shadow:var(--shadow);transition:transform .12s}
.card:active{transform:scale(.985)}
.card .meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:4px;flex-wrap:wrap}
.card h3{font-size:17px;margin-bottom:4px}
.card p{margin:0 0 12px;font-size:14px;color:var(--muted)}
.card .foot{display:flex;align-items:center;gap:10px;font-size:13px}
.card .foot .bar{flex:1}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;letter-spacing:.03em}
.pill.new{background:var(--new-soft);color:var(--new)}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.pill.lesson{background:var(--brand-soft);color:var(--brand)}
.card.wrongs{border-color:var(--bad);background:linear-gradient(0deg,var(--bad-soft),var(--card) 70%)}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:12px}

/* quiz */
.qhead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.qhead .bar{flex:1}
.qhead .count{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
.qtitle{font-size:13px;color:var(--muted);margin-bottom:8px}
.qtext{font-size:19px;font-weight:600;margin:0 0 16px;letter-spacing:-.01em}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;font-size:16px;transition:border-color .15s,background .15s}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--bg);font-weight:700;font-size:14px}
.opt:not([disabled]):active{border-color:var(--brand)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .k{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.55}
.explain{border-radius:14px;padding:14px;margin:4px 0 14px;font-size:15px;animation:pop .2s ease}
.explain.ok{background:var(--ok-soft)}
.explain.bad{background:var(--bad-soft)}
.explain strong{display:block;margin-bottom:4px}
.explain,.review .ex{white-space:pre-line}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.btn{display:block;width:100%;padding:15px;border-radius:14px;font-weight:700;font-size:16px;background:var(--brand);color:#fff;text-align:center}
@media (prefers-color-scheme:dark){.btn{color:#062b27}}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn+.btn{margin-top:10px}
.back{display:inline-flex;align-items:center;gap:6px;font-size:15px;color:var(--muted);padding:8px 0;margin-bottom:8px}

/* result */
.score{text-align:center;padding:24px 16px;background:var(--card);border:1px solid var(--line);border-radius:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.ring{width:140px;height:140px;margin:0 auto 12px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:34px;font-variant-numeric:tabular-nums}
.score h2{font-size:20px;margin-bottom:4px}
.score p{margin:0;color:var(--muted)}
.review{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.review .q{font-weight:600;margin-bottom:8px}
.review .line{font-size:14px;display:flex;gap:6px;margin:2px 0}
.review .line.y{color:var(--bad)}
.review .line.c{color:var(--ok)}
.review .ex{font-size:14px;color:var(--muted);margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
.tabs{display:flex;gap:6px;margin-bottom:12px;background:var(--card);border:1px solid var(--line);padding:4px;border-radius:12px}
.tabs button{flex:1;padding:8px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--brand-soft);color:var(--brand)}

/* v2: ders / konu / sürüm */
.vbanner{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--new-soft);border:1px solid var(--new);border-radius:16px;padding:14px;margin-bottom:16px}
.vbanner .vtag{flex:none;font-weight:800;font-size:18px;color:#fff;background:var(--new);border-radius:12px;padding:8px 10px}
.vbanner b{display:block;color:var(--new)}
.vbanner span{font-size:13px;color:var(--ink)}
.pill.v{background:var(--line);color:var(--muted)}
.pill.vcur{background:transparent;color:var(--new);box-shadow:inset 0 0 0 1.5px var(--new)}
.course h3{font-size:19px}
.unit{margin:22px 0 8px}
.unit-head{display:flex;align-items:center;gap:10px;margin:0 2px 10px}
.unit-head .code{flex:none;min-width:44px;text-align:center;font-size:12px;font-weight:800;color:var(--brand);background:var(--brand-soft);border-radius:8px;padding:4px 6px}
.unit-head h2{font-size:16px;flex:1}
.unit-head small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.unit .card{margin-left:0}
.src{font-size:12px;color:var(--muted)}
.course-title small{display:block;color:var(--muted);font-size:13px}
.course-title h1{font-size:22px;margin-bottom:12px}
.changelog{font-size:13px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:8px}
.changelog div{margin:2px 0}
.changelog b{color:var(--ink)}

/* v3: görsel sorular ve kartlar */
.qimg{display:block;width:100%;max-width:300px;aspect-ratio:4/5;object-fit:contain;margin:0 auto 14px;border-radius:16px;border:1px solid var(--line);background:#fff}
.ogrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.opt.imgopt{flex-direction:column;align-items:stretch;gap:6px;padding:8px;margin:0;position:relative}
.opt.imgopt .k{position:absolute;top:8px;left:8px}
.opt.imgopt img{width:100%;aspect-ratio:4/5;object-fit:contain;border-radius:10px;background:#fff;display:block}
.opt.imgopt .cap{font-size:14px;font-weight:700;text-align:center;min-height:0}
.thumbs{display:flex;gap:8px;margin:6px 0}
.thumbs figure{margin:0;flex:0 0 90px;text-align:center;font-size:12px;color:var(--muted)}
.thumbs img{width:90px;border-radius:8px;border:2px solid var(--line);background:#fff;display:block}
.thumbs .c img{border-color:var(--ok)} .thumbs .y img{border-color:var(--bad)}
.unit-tools{display:flex;gap:8px;margin:-2px 0 10px}
.chip{font-size:13px;font-weight:600;padding:8px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--ink)}
.chip.brand{background:var(--brand-soft);border-color:transparent;color:var(--brand)}
.flash{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;text-align:center;box-shadow:var(--shadow)}
.flash img{width:100%;max-width:320px;aspect-ratio:4/5;object-fit:contain;border-radius:14px;background:#fff;display:block;margin:0 auto}
.flash .ans{font-size:26px;font-weight:800;margin:12px 0 2px;letter-spacing:-.01em}
.flash .pg{font-size:13px;color:var(--muted)}
.flash .hid{font-size:15px;color:var(--muted);margin:14px 0 4px}
.navrow{display:grid;grid-template-columns:1fr 2fr 1fr;gap:8px;margin-top:12px}
.navrow .btn{padding:13px}
.allmix{margin-bottom:6px}
/* v5: rapor */
.card.share{border-style:dashed}
.sharebox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;font-size:14px}
.sharebox textarea,#copymsg textarea{display:block;width:100%;margin-top:8px;font:13px ui-monospace,Menlo,monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px;resize:none}
.rrow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.rrow small{display:block;color:var(--muted);font-size:12px}
.rrow span{font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.runit{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;padding:0 12px}
.runit summary{display:flex;align-items:center;gap:10px;padding:12px 0;cursor:pointer;list-style:none}
.runit summary::-webkit-details-marker{display:none}
.runit .code{flex:none;min-width:44px;text-align:center;font-size:12px;font-weight:800;color:var(--brand);background:var(--brand-soft);border-radius:8px;padding:4px 6px}
.runit .rt{flex:1;font-weight:600;font-size:15px}
.runit .rt small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.runit summary b{font-size:16px;font-variant-numeric:tabular-nums}
.runit summary b.none{color:var(--muted)}
.runit[open]{padding-bottom:10px}
.runit .review{background:var(--bg)}
.rtest{font-size:13px;margin:0 0 8px}
.rtest small{color:var(--muted)}
#copymsg{padding:8px 0 0}
/* v6: kas tablosu */
.ktablecard{border-color:var(--brand);background:linear-gradient(0deg,var(--brand-soft),var(--card) 75%)}
.ksearch{display:block;width:100%;font:inherit;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:10px}
.klegend{font-size:12px;color:var(--muted);margin:0 2px 4px}
.kcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.kcard h3{font-size:16px;margin-bottom:2px}
.kalt{font-size:12px;color:var(--muted);margin-bottom:4px}
.kcard dl{display:grid;grid-template-columns:22px 1fr;gap:6px 8px;margin:8px 0 0;font-size:14px}
.kcard dt{font-weight:800;color:var(--brand)}
.kcard dd{margin:0}
.knote{font-size:13px;color:var(--muted);background:var(--bg);border-radius:10px;padding:8px 10px;margin:8px 0 10px}
.kcard .knote{margin-bottom:0}
[hidden]{display:none!important}
/* v7: açılış */
.splash{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px;background:rgba(20,10,15,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fadein .3s ease}
.splash.out{opacity:0;transition:opacity .25s}
.splash-card{width:100%;max-width:380px;background:var(--card);border-radius:24px;padding:28px 22px 20px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35);border:1px solid var(--line);animation:rise .4s cubic-bezier(.2,.9,.3,1.2)}
.splash-heart{font-size:54px;line-height:1;animation:beat 1.2s ease-in-out infinite}
.splash-card h2{font-size:24px;margin:12px 0 8px;color:#e11d48}
@media (prefers-color-scheme:dark){.splash-card h2{color:#fb7185}}
.splash-card p{font-size:16px;margin:0 0 14px}
.splash-stat{font-size:13px;color:var(--muted);background:var(--bg);border-radius:12px;padding:8px 10px;margin-bottom:14px}
.splash .btn{background:#e11d48;color:#fff}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.12)}}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
/* arşiv */
.card.arch{opacity:.82}
.card.newterm{border-style:dashed;cursor:default}
.archnote{font-size:13px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
details.changelog summary{cursor:pointer;font-weight:600;color:var(--ink)}
details.changelog[open] summary{margin-bottom:6px}
.footer{text-align:center;font-size:12px;color:var(--muted);padding:24px 0 8px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script src="data-tid-sinav.js?v=8a"></script>

</body>
</html>
